[project]
name = "triton-ops-lab"
version = "0.1.0"
description = "Reproducible Triton operator research with CPU references and explicit GPU verification gates"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.8.0", "numpy>=2.1,<3", "matplotlib>=3.9,<4"]

[project.scripts]
triton-lab = "triton_ops_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

# PyTorch's Linux distribution declares the matching CUDA libraries and Triton.
# macOS's native wheel does not depend on those Linux packages.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires Linux NVIDIA CUDA GPU with compute capability >= 8.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/triton_ops_lab"]
